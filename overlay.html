<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kylen Chat for Twitch · Chat</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://static-cdn.jtvnw.net https://cdn.7tv.app https://cdn.betterttv.net https://cdn.frankerfacez.com; connect-src wss://irc-ws.chat.twitch.tv:443 wss://events.7tv.io https://7tv.io https://api.betterttv.net https://api.ivr.fi; style-src 'self' 'unsafe-inline'">
<style>
  /* Fuente incluida en la app (licencia OFL, ver assets/fonts/OFL.txt): se ve igual aunque el PC no la tenga. */
  @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/SpaceGrotesk.ttf") format("truetype"); font-weight: 300 700; font-display: swap; }
  :root {
    --fs: 16px;
    --ff: "Segoe UI";
    --fw: 400;
    --color: #fff;
    --bg: rgba(0, 0, 0, .35);
    --shadow: none;
    --opacity: 1;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: var(--ff), "Segoe UI", sans-serif; font-size: var(--fs); font-weight: var(--fw); color: var(--color); }

  #chat {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
    padding: 6px; box-sizing: border-box; overflow: hidden;
    opacity: var(--opacity); transition: opacity .8s;
  }
  body.newest-top #chat { flex-direction: column-reverse; justify-content: flex-end; }
  /* Sin mensajes durante un rato: se atenúa, pero se sigue pudiendo leer de un vistazo. */
  body.idle #chat, body.idle #bar { opacity: calc(var(--opacity) * .25); }
  .msg {
    --edge: transparent; --dir: 90deg;
    align-self: flex-start; max-width: 100%; box-sizing: border-box;
    padding: 3px 8px 3px 5px; border-left: 3px solid var(--edge); border-radius: 6px; background: var(--bg);
    line-height: 1.35; overflow-wrap: anywhere; text-shadow: var(--shadow);
    transition: opacity .6s;
  }
  .msg.fade { opacity: 0; }
  .msg.system { opacity: .75; font-size: .85em; }
  .msg.notice { --edge: #a970ff; background: linear-gradient(var(--dir), rgba(145, 70, 255, .45), var(--bg)); }
  .notice-title { font-weight: 700; font-size: .9em; }
  /* Destacados */
  /* Mismo tono rojo con el que Twitch marca las menciones */
  .msg.mention { --edge: #eb0400; background: linear-gradient(var(--dir), rgba(235, 4, 0, .42), var(--bg)); }
  .msg.first { --edge: #3ddc84; }
  .msg.highlighted { background: linear-gradient(var(--dir), rgba(145, 70, 255, .55), var(--bg)); }
  .msg.bits { --edge: #ff9df5; }
  /* Alineado a la derecha (para cuando el chat está en ese lado de la pantalla) */
  body.align-right .msg { --dir: 270deg; align-self: flex-end; text-align: right; border-left: 0; border-right: 3px solid var(--edge); padding: 3px 5px 3px 8px; }
  .pill {
    display: inline-block; margin-right: 5px; padding: 0 6px; border-radius: 999px;
    font-size: .68em; font-weight: 700; line-height: 1.6; vertical-align: .15em; text-shadow: none; color: #fff;
  }
  .pill-first { background: #1f9d55; }
  .pill-bits { background: #c43fc0; }
  .pill-highlighted { background: #7c3aed; }
  .pill-redeem { background: #2b6cb0; }
  /* Icono del canal de origen en el chat compartido (oculto hasta que carga) */
  .channel-icon { width: 1.15em; height: 1.15em; border-radius: 50%; margin-right: 4px; vertical-align: -.22em; object-fit: cover; }
  .channel-icon:not([src]) { display: none; }
  .badge { height: 1.05em; width: 1.05em; margin-right: 3px; vertical-align: -.15em; }
  .reply { font-size: .78em; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
  .time { font-size: .75em; opacity: .6; margin-right: 5px; font-variant-numeric: tabular-nums; }
  .name { font-weight: 700; }
  /* Nombre con pintura de 7TV: el degradado rellena las letras; las sombras las pone la pintura. */
  .name.painted { color: transparent !important; -webkit-background-clip: text; background-clip: text; text-shadow: none; }
  .emote { height: calc(var(--emote, 1.6) * 1em); vertical-align: middle; margin: -.2em 0; }
  .stack { display: inline-grid; vertical-align: middle; }
  .stack > .emote { grid-area: 1 / 1; place-self: center; }

  /* Barra "Kylen Chat": siempre visible (es la firma de la app). Fina, semitransparente y sin
     interceptar clics (la ventana entera los deja pasar). */
  #bar {
    display: flex; position: absolute; top: 0; left: 0; right: 0; height: 24px; z-index: 1;
    align-items: center; gap: 6px; padding: 0 8px; box-sizing: border-box;
    font: 600 12px "Segoe UI", sans-serif; letter-spacing: .02em; color: rgba(255, 255, 255, .85);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
    background: linear-gradient(90deg, rgba(145, 70, 255, .38), rgba(145, 70, 255, .12) 60%, rgba(145, 70, 255, 0));
    border-radius: 6px 6px 0 0;
    opacity: var(--opacity);
  }
  #bar { transition: opacity .8s; }
  #bar img { width: 16px; height: 16px; }
  #toast {
    position: absolute; top: 32px; left: 50%; transform: translateX(-50%); z-index: 4;
    background: #9146ff; color: #fff; font: 600 12px "Segoe UI", sans-serif; text-shadow: none;
    padding: 4px 12px; border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .3s;
  }
  #toast.show { opacity: 1; }
  #barChannel { margin-left: auto; font-weight: 400; color: rgba(255, 255, 255, .6); }
  #chat { top: 24px; }

  body.edit { -webkit-app-region: drag; cursor: move; background: rgba(20, 20, 30, .35); outline: 2px dashed #a970ff; outline-offset: -2px; }
  #hint {
    display: none; position: absolute; top: 6px; left: 6px; right: 6px; z-index: 2;
    font: 12px "Segoe UI", sans-serif; text-shadow: none; text-align: center;
    background: #9146ff; color: #fff; padding: 4px 8px; border-radius: 4px;
  }
  body.edit #hint { display: block; }
  #grip {
    display: none; position: absolute; right: 0; bottom: 0; width: 24px; height: 24px; z-index: 3;
    -webkit-app-region: no-drag; cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 50%, #a970ff 50%);
  }
  body.edit #grip { display: block; }
</style>
</head>
<body>
  <div id="bar"><img src="assets/tray@2x.png" alt="">Kylen Chat<span id="barChannel"></span></div>
  <div id="chat"></div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="grip"></div>
  <script src="i18n.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
