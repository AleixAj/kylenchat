<svg xmlns="http://www.w3.org/2000/svg" width="460" height="96" viewBox="0 0 460 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B27BFF"/>
      <stop offset="1" stop-color="#6A1FD8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#6A1FD8" flood-opacity=".45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="8" y="6" width="444" height="76" rx="20" fill="url(#bg)"/>
    <rect x="8" y="6" width="444" height="76" rx="20" fill="url(#shine)"/>
    <rect x="8.75" y="6.75" width="442.5" height="74.5" rx="19.25" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/>
  </g>

  <!-- Icono de descarga en un círculo -->
  <circle cx="52" cy="44" r="22" fill="#fff" fill-opacity=".18"/>
  <path d="M52 32v17m-7-7 7 7 7-7M42 56h20" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="88" y="42" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Download for Windows</text>
  <text x="88" y="64" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#fff" fill-opacity=".85">Installer · Free · Auto-updates</text>

  <!-- Logo de Windows -->
  <g fill="#fff" fill-opacity=".9" transform="translate(404 32)">
